name: Deploy Acme Equipment

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: acme-equipment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::337023347628:role/GitHubActions-AcmeEquipment-Deploy
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Tag Docker image for ECR
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            337023347628.dkr.ecr.eu-north-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            337023347628.dkr.ecr.eu-north-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity
